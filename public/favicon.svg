<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<!--배경 원-->
  <circle cx="100" cy="100" r="90" fill="#FFD93D"/>
<!--노트북 바탕-->
  <rect x="45" y="55" width="110" height="100" rx="8" fill="white" stroke="#FFB039" stroke-width="3"/>
<!--노트 라인들-->
  <g stroke="#E8E8E8" stroke-width="2">
    <line x1="55" y1="85" x2="145" y2="85"/>
    <line x1="55" y1="105" x2="145" y2="105"/>
    <line x1="55" y1="125" x2="145" y2="125"/>
    <line x1="55" y1="145" x2="145" y2="145"/>
  </g>
<!--스프링-->
  <g stroke="#FFB039" stroke-width="2">
    <path d="M45 60 Q 40 60, 40 65" fill="none"/>
    <path d="M45 70 Q 40 70, 40 75" fill="none"/>
    <path d="M45 80 Q 40 80, 40 85" fill="none"/>
    <path d="M45 90 Q 40 90, 40 95" fill="none"/>
    <path d="M45 100 Q 40 100, 40 105" fill="none"/>
    <path d="M45 110 Q 40 110, 40 115" fill="none"/>
    <path d="M45 120 Q 40 120, 40 125" fill="none"/>
    <path d="M45 130 Q 40 130, 40 135" fill="none"/>
    <path d="M45 140 Q 40 140, 40 145" fill="none"/>
  </g>
<!--작은 연필-->
  <g transform="translate(120, 45) rotate(45)">
    <rect x="0" y="0" width="30" height="6" rx="2" fill="#FFB039"/>
    <polygon points="30,1 30,5 35,3" fill="#FF8A39"/>
  </g>
<!--귀여운 눈-->
  <g fill="#4A4A4A">
    <circle cx="80" cy="70" r="4"/>
    <circle cx="120" cy="70" r="4"/>
  </g>
<!--귀여운 미소-->
  <path d="M85 75 Q100 85 115 75" stroke="#4A4A4A" stroke-width="3" fill="none"/>
</svg>
